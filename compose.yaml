services:
  redis:
    image: redis:8-alpine
    # Bound to loopback: this Redis has no password, so it must not be
    # reachable from the network. Host-mode development and the integration
    # tests reach it here.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
